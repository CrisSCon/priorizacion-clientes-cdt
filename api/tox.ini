[tox]
min_version = 4
env_list = py312
skipsdist = true

[testenv]
description = Exercise the HTTP API using the committed model wheel
change_dir = {tox_root}{/}..
deps =
    -r{tox_root}{/}requirements.txt
    {tox_root}{/}model_pkg{/}cdt_model_pkg-0.1.0-py3-none-any.whl
    httpx2==2.16.2
    pytest>=8,<10
commands = python -B -m pytest {posargs:api/tests}
